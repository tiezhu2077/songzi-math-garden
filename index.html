  'use strict';
  const panel = document.getElementById('songziBoot');
  const message = document.getElementById('songziBootMessage');
  const retry = document.getElementById('songziBootRetry');
  const app = document.querySelector('script[data-songzi-app]');
  if (!panel || !app) return;
  function fail(text) {
    panel.hidden = false;
    message.textContent = text;
    retry.hidden = false;
  }
  retry.addEventListener('click', function () { location.reload(); });
  const slow = setTimeout(function () {
    if (!window.SONGZI_APP_READY) fail('花园还在准备，网络可能有点慢。可以继续等待，也可以重新加载。');
  }, 12000);
  app.addEventListener('error', function () {
    clearTimeout(slow);
    fail('花园资源没有加载完成，请检查网络后重新加载。');
  });
  app.addEventListener('load', function () {
    clearTimeout(slow);
    if (window.SONGZI_APP_READY) panel.hidden = true;
    else fail('花园暂时未能启动，请重新加载。');
  });
  window.addEventListener('error', function (event) {
    if (!window.SONGZI_APP_READY && event.filename === app.src) {
      clearTimeout(slow); fail('花园暂时未能启动，请重新加载。');
    }
  });
})();
